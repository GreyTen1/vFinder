[package]
name = "vfinder"
version = "0.4.0-alpha"
description = "vFinder File Manager"
authors = ["vFinder Contributors"]
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
trash = "5.2"
open = "5.3"
dirs = "6.0"
mime_guess = "2.0"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
md-5 = "0.11.0"
zip = "8.6"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
zstd = "0.13"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
