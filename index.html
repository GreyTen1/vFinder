<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Finder</title>
    <style>
      html, body, #root {
        background-color: #1e1e22 !important;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: pan-x pan-y;
      }
    </style>
    <script>
      (function() {
        function blockPinch(e) {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
          }
        }
        window.addEventListener("wheel", blockPinch, { passive: false, capture: true });
        document.addEventListener("wheel", blockPinch, { passive: false, capture: true });

        function blockMultiTouch(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }
        window.addEventListener("touchstart", blockMultiTouch, { passive: false, capture: true });
        window.addEventListener("touchmove", blockMultiTouch, { passive: false, capture: true });
        document.addEventListener("touchstart", blockMultiTouch, { passive: false, capture: true });
        document.addEventListener("touchmove", blockMultiTouch, { passive: false, capture: true });

        function blockGesture(e) {
          e.preventDefault();
        }
        window.addEventListener("gesturestart", blockGesture, { passive: false, capture: true });
        window.addEventListener("gesturechange", blockGesture, { passive: false, capture: true });
        window.addEventListener("gestureend", blockGesture, { passive: false, capture: true });
      })();
    </script>
  </head>
  <body class="select-none overflow-hidden bg-[#1e1e22] antialiased">
    <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none" aria-hidden="true">
      <defs>
        <linearGradient id="macos-folder-back" x1="32" y1="8" x2="32" y2="30" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#52B6F7" />
          <stop offset="100%" stop-color="#268CE0" />
        </linearGradient>
        <linearGradient id="macos-folder-front" x1="32" y1="18" x2="32" y2="56" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#82D4FF" />
          <stop offset="22%" stop-color="#5FC3FA" />
          <stop offset="100%" stop-color="#2594EB" />
        </linearGradient>
        <linearGradient id="macos-doc-page" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#E9ECEF" />
        </linearGradient>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
